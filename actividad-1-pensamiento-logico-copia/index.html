<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=../area-1-practicas-firebase/index.html">
  <title>Redirigiendo a Prácticas Área 1</title>
  <style>
    :root {
      --brand: #226e93;
      --ink: #1f2933;
      --soft: #f2f6f8;
      --line: #d9e2ec;
    }

    * {
      box-sizing: border-box;
    }

    body {
      align-items: center;
      background: var(--soft);
      color: var(--ink);
      display: flex;
      font-family: Arial, Helvetica, sans-serif;
      justify-content: center;
      line-height: 1.5;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }

    main {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      max-width: 640px;
      padding: 34px;
      text-align: center;
    }

    h1 {
      color: var(--brand);
      margin-top: 0;
    }

    a {
      background: var(--brand);
      border-radius: 8px;
      color: #fff;
      display: inline-block;
      font-weight: 700;
      margin-top: 12px;
      padding: 12px 18px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Esta era la copia de ejemplo</h1>
    <p>La plataforma correcta para alumnos de Área 1 está organizada por unidades y usa Firebase.</p>
    <a href="../area-1-practicas-firebase/index.html">Abrir Prácticas Área 1</a>
  </main>
</body>
</html>
